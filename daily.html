<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Daily Calendar View</title>

  <!-- Link to style files -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="calendar.css">

  <!-- Makes the page look good on mobile -->
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- Set the font for the whole page -->
  <style>
    body { font-family: 'Times New Roman', Times, serif; }

    /* Daily view specific styles */
    .daily-calendar {
      background: #fd9e9ebf;
      border-radius: 40px;
      padding: 25px 30px;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .week-header {
      text-align: center;
      margin-bottom: 15px;
    }

    .week-title {
      font-size: 42px;
      color: #000;
      font-weight: bold;
      margin: 0;
    }

    .week-navigation {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .nav-btn {
      background: #FF6B6B;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .nav-btn:hover {
      background: #ff5252;
    }

    .days-header {
      display: grid;
      grid-template-columns: 80px repeat(7, 1fr);
      gap: 1px;
      background: rgba(0, 0, 0, 0.15);
      border: 2px solid rgba(0, 0, 0, 0.15);
      padding: 10px;
      margin-bottom: 0;
    }

    .day-column {
      text-align: center;
      font-weight: bold;
      color: white;
      padding: 8px;
    }

    .day-column.today-header {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }

    .schedule-container {
      flex: 1;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.15);
      border: 2px solid rgba(0, 0, 0, 0.15);
      border-top: none;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: 80px repeat(7, 1fr);
      gap: 1px;
      background: rgba(0, 0, 0, 0.15);
    }

    .time-slot {
      background: rgba(255, 255, 255, 0.2);
      padding: 8px;
      font-size: 14px;
      color: white;
      font-weight: bold;
      text-align: center;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .schedule-cell {
      background: rgba(255, 255, 255, 0.3);
      padding: 4px;
      min-height: 60px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: background 0.2s;
    }

    .schedule-cell:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .schedule-cell.today {
      background: rgba(255, 255, 255, 0.6);
    }

    .schedule-event {
      background: rgba(255, 107, 107, 0.7);
      color: white;
      padding: 4px 6px;
      margin: 2px 0;
      border-radius: 3px;
      font-size: 11px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .schedule-event strong {
      display: block;
      font-weight: bold;
    }

    .schedule-event small {
      font-size: 10px;
      opacity: 0.9;
    }

    @media (max-width: 900px) {
      .days-header {
        grid-template-columns: 60px repeat(7, 1fr);
      }
      .schedule-grid {
        grid-template-columns: 60px repeat(7, 1fr);
      }
      .day-column {
        font-size: 12px;
        padding: 4px;
      }
    }
  </style>
</head>
<body>

  <!-- Top navigation bar with buttons and title -->
  <header class="topbar">
    <!-- Left side buttons for view options -->
    <div class="top-left">
      <button class="mini" id="btn-monthly">Monthly</button>
      <button class="mini" id="btn-daily">Daily</button>
      <button class="mini" id="btn-yearly">Yearly</button>
    </div>

    <!-- Center title showing the year -->
    <div class="title" id="topYear">CALENDAR 2025</div>

    <!-- Right side buttons for actions -->
    <div class="top-right">
      <button class="mini" id="btn-add">Add</button>
      <button class="mini" id="btn-delete">Delete</button>
      <button class="mini" id="btn-color">Color</button>
      <button class="mini" id="btn-help" title="Keyboard Shortcuts">?</button>
      <div class="shortcuts-dropdown" id="shortcuts-dropdown">
        <h4>Keyboard Shortcuts</h4>
        <div class="shortcut-item"><kbd>Ctrl+A</kbd> Add Event</div>
        <div class="shortcut-item"><kbd>Ctrl+D</kbd> Delete Mode</div>
        <div class="shortcut-item"><kbd>Ctrl+1</kbd> Main Calendar</div>
        <div class="shortcut-item"><kbd>Ctrl+2</kbd> Daily View</div>
        <div class="shortcut-item"><kbd>Ctrl+3</kbd> Yearly View</div>
        <div class="shortcut-item"><kbd>Ctrl+4</kbd> Monthly View</div>
      </div>
    </div>
  </header>

  <!-- Display weather -->
  <div class="weather" id="weather">
    <img id="weather-icon" alt="Weather icon" aria-label="Current weather icon"/>
    <span id="weather-temp">Loading Weather...</span>
  </div>

  <!-- Main layout with calendar and sidebar -->
  <div class="layout">

    <!-- Daily Calendar section -->
    <main class="calendar-panel">
      <div class="daily-calendar">

        <!-- Week title and navigation -->
        <div class="week-header">
          <div class="week-title" id="weekTitle">Week View</div>
          <div class="week-navigation">
            <button class="nav-btn" id="prevWeek">← Previous Week</button>
            <button class="nav-btn" id="todayBtn">Today</button>
            <button class="nav-btn" id="nextWeek">Next Week →</button>
          </div>
        </div>

        <!-- Days of the week header -->
        <div class="days-header" id="daysHeader">
          <div class="time-label"></div>
          <!-- Day headers filled by JavaScript -->
        </div>

        <!-- Time slots grid -->
        <div class="schedule-container">
          <div class="schedule-grid" id="scheduleGrid">
            <!-- Filled by JavaScript -->
          </div>
        </div>
      </div>
    </main>

    <!-- Right sidebar with cards -->
    <aside class="sidebar">

      <!-- Productivity graph card -->
      <div class="card graph">
        <div class="card-title">Productivity Graph</div>
        <div class="graph-box">
          <!-- Simple line graph -->
          <svg viewBox="0 0 100 70" preserveAspectRatio="none">
            <polyline points="5,65 30,40 60,30 95,5" fill="none" stroke="#333" stroke-width="2"/>
          </svg>
        </div>
      </div>

      <!-- To-do list card -->
      <div class="card goals">
        <div class="card-title">To-Do:
          <button class="mini" id="btn-add-to-do">Add</button>
          <button class="mini" id="btn-delete-to-do">Delete</button>
        </div>
        <input type="text" class="mini" id="to-do-input" placeholder="Type new task...">
        <ul class="To-do-list">
        </ul>
      </div>
    </aside>
  </div>

  <!-- JavaScript for daily calendar -->
  <script>
    // Current week state
    let currentWeekStart = new Date();
    currentWeekStart.setHours(0, 0, 0, 0);
    // Set to start of week (Sunday)
    currentWeekStart.setDate(currentWeekStart.getDate() - currentWeekStart.getDay());

    const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    // Hours to display (6 AM to 10 PM)
    const startHour = 6;
    const endHour = 22;

    // Make renderWeek globally accessible for main.js
    window.renderWeek = function renderWeek() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // Update week title
      const weekEnd = new Date(currentWeekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);
      document.getElementById('weekTitle').textContent =
        `${monthNames[currentWeekStart.getMonth()]} ${currentWeekStart.getDate()} - ${monthNames[weekEnd.getMonth()]} ${weekEnd.getDate()}, ${currentWeekStart.getFullYear()}`;

      document.getElementById('topYear').textContent = 'CALENDAR ' + currentWeekStart.getFullYear();

      // Get events from localStorage (reload to get latest)
      const events = JSON.parse(localStorage.getItem('calendarEvents')) || [];

      // Create day headers
      const daysHeader = document.getElementById('daysHeader');
      // Clear existing headers except the time label
      while (daysHeader.children.length > 1) {
        daysHeader.removeChild(daysHeader.lastChild);
      }

      // Add day headers
      for (let i = 0; i < 7; i++) {
        const date = new Date(currentWeekStart);
        date.setDate(date.getDate() + i);
        const isToday = date.getTime() === today.getTime();

        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-column' + (isToday ? ' today-header' : '');
        dayHeader.innerHTML = `${dayNames[i]}<br>${date.getDate()}`;
        daysHeader.appendChild(dayHeader);
      }

      // Create schedule grid
      const scheduleGrid = document.getElementById('scheduleGrid');
      scheduleGrid.innerHTML = '';

      for (let hour = startHour; hour <= endHour; hour++) {
        // Time label
        const timeSlot = document.createElement('div');
        timeSlot.className = 'time-slot';
        const ampm = hour >= 12 ? 'PM' : 'AM';
        const displayHour = hour > 12 ? hour - 12 : (hour === 0 ? 12 : hour);
        timeSlot.textContent = `${displayHour} ${ampm}`;
        scheduleGrid.appendChild(timeSlot);

        // Day cells for this hour
        for (let i = 0; i < 7; i++) {
          const date = new Date(currentWeekStart);
          date.setDate(date.getDate() + i);
          const isToday = date.getTime() === today.getTime();
          const dateString = date.toISOString().split('T')[0];

          const cell = document.createElement('div');
          cell.className = 'schedule-cell' + (isToday ? ' today' : '');
          cell.dataset.date = dateString;
          cell.dataset.hour = hour;

          // Check for events on this date and hour
          const dayEvents = events.filter(event => event.date === dateString);
          
          dayEvents.forEach(event => {
            let shouldDisplay = false;
            
            // If event has specific time, only show in the appropriate hour slot
            if (event.startTime) {
              const startHour = parseInt(event.startTime.split(':')[0]);
              const endHour = event.endTime ? parseInt(event.endTime.split(':')[0]) : startHour;
              
              // Show event if current hour is within the event's time range
              if (hour >= startHour && hour <= endHour) {
                shouldDisplay = true;
              }
            } else {
              // All-day event: only show once at the first hour (6 AM)
              if (hour === startHour) {
                shouldDisplay = true;
              }
            }
            
            if (shouldDisplay) {
              const eventDiv = document.createElement('div');
              eventDiv.className = 'schedule-event';
              
              // Format time display
              let timeDisplay = '';
              if (event.startTime) {
                const formatTime = (time24) => {
                  const [h, m] = time24.split(':');
                  const hour = parseInt(h);
                  const ampm = hour >= 12 ? 'PM' : 'AM';
                  const hour12 = hour > 12 ? hour - 12 : (hour === 0 ? 12 : hour);
                  return `${hour12}:${m} ${ampm}`;
                };
                
                timeDisplay = formatTime(event.startTime);
                if (event.endTime) {
                  timeDisplay += ' - ' + formatTime(event.endTime);
                }
                timeDisplay = '<br><small>' + timeDisplay + '</small>';
              }
              
              eventDiv.innerHTML = `<strong>${event.title}</strong>${timeDisplay}${event.description ? '<br><small>' + event.description + '</small>' : ''}`;
              eventDiv.title = event.description || event.title;
              eventDiv.setAttribute('data-event-id', event.id);
              
              // Add click handler for delete mode
              eventDiv.addEventListener('click', (e) => {
                // Check if delete mode is active (from main.js)
                const deleteBtn = document.getElementById('btn-delete');
                const isDeleteMode = deleteBtn && deleteBtn.textContent === 'Cancel';
                
                if (isDeleteMode) {
                  e.stopPropagation();
                  if (confirm(`Delete event "${event.title}"?`)) {
                    // Reload events, filter out deleted one, save and re-render
                    let allEvents = JSON.parse(localStorage.getItem('calendarEvents')) || [];
                    allEvents = allEvents.filter(evt => evt.id !== event.id);
                    localStorage.setItem('calendarEvents', JSON.stringify(allEvents));
                    renderWeek();
                  }
                }
              });
              
              cell.appendChild(eventDiv);
            }
          });

          scheduleGrid.appendChild(cell);
        }
      }
    }

    // Navigation buttons
    document.getElementById('prevWeek').addEventListener('click', () => {
      currentWeekStart.setDate(currentWeekStart.getDate() - 7);
      renderWeek();
    });

    document.getElementById('nextWeek').addEventListener('click', () => {
      currentWeekStart.setDate(currentWeekStart.getDate() + 7);
      renderWeek();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      currentWeekStart = new Date();
      currentWeekStart.setHours(0, 0, 0, 0);
      currentWeekStart.setDate(currentWeekStart.getDate() - currentWeekStart.getDay());
      renderWeek();
    });

    // Initial render
    renderWeek();

    //Request weather from Weatherstack API
    async function getWeather(lat, lon) {
      try {
        const pointsRes = await fetch(`https://api.weather.gov/points/${lat},${lon}`, {
          headers: { 'User-Agent': 'CalendarApp mustangurl01@outlook.com' }
        });
        if (!pointsRes.ok) throw new Error("Failed to get points data");
        const pointsData = await pointsRes.json();

        const forecastUrl = pointsData.properties.forecast;
        const forecastRes = await fetch(forecastUrl, {
          headers: { 'User-Agent': 'CalendarApp mustangurl01@outlook.com' }
        });
        if (!forecastRes.ok) throw new Error("Failed to get forecast data");
        const forecastData = await forecastRes.json();

        const period = forecastData.properties.periods[0];
        document.getElementById('weather-icon').src = period.icon;
        document.getElementById('weather-icon').alt = period.shortForecast;
        document.getElementById('weather-temp').textContent = `${period.temperature}°${period.temperatureUnit}`;
        document.getElementById('weather-temp').title = period.shortForecast;

      } catch (err) {
        console.error("Weather fetch error:", err);
        document.getElementById('weather').textContent = "Weather: Unable to display the weather";
      }
    }
    getWeather(38.4496, -78.8689);

    // Navigation buttons
    const daily = document.getElementById('btn-daily');
    daily.addEventListener('click', () => {
      window.location.href = 'daily.html';
    });

    const monthly = document.getElementById('btn-monthly');
    monthly.addEventListener('click', () => {
      window.location.href = 'monthly.html';
    });

    const yearly = document.getElementById('btn-yearly');
    yearly.addEventListener('click', () => {
      window.location.href = 'yearly.html';
    });

    //Functionality for To-Do List

    const toDoList = document.querySelector('.To-do-list');
    const addToDoBtn = document.getElementById('btn-add-to-do');
    const deleteCheckedToDo = document.getElementById('btn-delete-to-do');
    const inputToDo = document.getElementById('to-do-input');
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];


    function renderTasks() {
      toDoList.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done || false;

        const textSpan = document.createElement('span');
        textSpan.textContent = task.text;

        // Apply strikethrough if checked
        if (checkbox.checked) li.classList.add('checked');

        // When checkbox changes
        checkbox.addEventListener('change', () => {
          task.done = checkbox.checked;
          if (task.done) {
            li.classList.add('checked');
          } else {
            li.classList.remove('checked');
          }
          localStorage.setItem('tasks', JSON.stringify(tasks));
        });

        li.appendChild(checkbox);
        li.appendChild(textSpan);
        toDoList.appendChild(li);
      });
    }
    addToDoBtn.addEventListener('click', () => {
      const taskText = inputToDo.value.trim();
      if (!taskText) return;
      tasks.push({ text: taskText, done: false });
      localStorage.setItem('tasks', JSON.stringify(tasks));
      inputToDo.value = '';
      renderTasks();
    });

    deleteCheckedToDo.addEventListener('click', () => {
      tasks = tasks.filter(task => !task.done);
      localStorage.setItem('tasks', JSON.stringify(tasks));
      renderTasks();
    });

    //enter creates new task
    inputToDo.addEventListener('keypress', (e) => {
      if (e.key === "Enter") addToDoBtn.click();
    });

    renderTasks();

  </script>

  <dialog id="dlg-color">
    <form method="dialog" class="color-form">
      <h3>Main Color</h3>
      <input type="color" id="mainColorPicker" name="mainColor" value="#ff0000">
      <h3>Accent Color</h3>
      <input type="color" id="accentColorPicker" name="accentColor" value="#00ff00">
      <div class="dialog-buttons">
        <button value="cancel">Cancel</button>
        <button value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-add-event">
    <form method="dialog" class="event-form">
      <h3>Add New Event</h3>
      <div class="form-group">
        <label for="eventTitle">Event Title:</label>
        <input type="text" id="eventTitle" name="eventTitle" required>
      </div>
      <div class="form-group">
        <label for="eventDescription">Description:</label>
        <textarea id="eventDescription" name="eventDescription" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label for="eventDate">Date:</label>
        <input type="date" id="eventDate" name="eventDate" required>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="addSpecificTime" name="addSpecificTime">
          Add specific time?
        </label>
      </div>
      <div id="timeFields" style="display: none;">
        <div class="form-group">
          <label for="eventStartTime">Start Time:</label>
          <input type="time" id="eventStartTime" name="eventStartTime">
        </div>
        <div class="form-group">
          <label for="eventEndTime">End Time:</label>
          <input type="time" id="eventEndTime" name="eventEndTime">
        </div>
      </div>
      <div class="dialog-buttons">
        <button value="cancel">Cancel</button>
        <button value="add" id="confirmAddEvent">Add Event</button>
      </div>
    </form>
  </dialog>
  <script src="main.js"></script>
  <script src="notifications.js"></script>

</body>
</html>
